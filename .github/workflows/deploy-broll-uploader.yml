name: Deploy Telegram B-roll uploader

on:
  workflow_dispatch:
    inputs:
      worker_url:
        description: "Optional workers.dev URL from the first deployment. Leave blank for the first run; enter it on the next run to register the Telegram webhook."
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.BROLL_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.BROLL_TELEGRAM_WEBHOOK_SECRET }}
      ALLOWED_TELEGRAM_USER_IDS: ${{ vars.BROLL_ALLOWED_TELEGRAM_USER_IDS }}
      WORKER_URL: ${{ inputs.worker_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TELEGRAM_BOT_TOKEN TELEGRAM_WEBHOOK_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub repository secret: $name"
              exit 1
            fi
          done
          if ! [[ "$TELEGRAM_WEBHOOK_SECRET" =~ ^[A-Za-z0-9_-]{1,256}$ ]]; then
            echo "::error::TELEGRAM_WEBHOOK_SECRET must contain only letters, numbers, underscores or hyphens (1–256 characters)."
            exit 1
          fi

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Configure Worker secrets
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$TELEGRAM_BOT_TOKEN" | wrangler secret put TELEGRAM_BOT_TOKEN --config workers/broll-uploader/wrangler.toml
          printf '%s' "$TELEGRAM_WEBHOOK_SECRET" | wrangler secret put TELEGRAM_WEBHOOK_SECRET --config workers/broll-uploader/wrangler.toml
          if [ -n "$ALLOWED_TELEGRAM_USER_IDS" ]; then
            printf '%s' "$ALLOWED_TELEGRAM_USER_IDS" | wrangler secret put ALLOWED_TELEGRAM_USER_IDS --config workers/broll-uploader/wrangler.toml
          fi

      - name: Deploy Worker
        shell: bash
        run: |
          set -euo pipefail
          wrangler deploy --config workers/broll-uploader/wrangler.toml

      - name: Register Telegram webhook
        if: inputs.worker_url != ''
        shell: bash
        run: |
          set -euo pipefail
          case "$WORKER_URL" in
            https://*.workers.dev|https://*.workers.dev/) ;;
            *)
              echo "::error::worker_url must be the HTTPS workers.dev URL printed by the first deployment."
              exit 1
              ;;
          esac
          response="$(curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=${WORKER_URL%/}/telegram/webhook" \
            --data-urlencode "secret_token=$TELEGRAM_WEBHOOK_SECRET" \
            --data-urlencode 'allowed_updates=["message","callback_query"]')"
          echo "$response" | jq -e '.ok == true and .result == true' >/dev/null
          echo "Telegram webhook registered for ${WORKER_URL%/}/telegram/webhook"

      - name: Show first-deployment instructions
        if: inputs.worker_url == ''
        run: |
          echo "Worker deployed. Copy its workers.dev URL from the Deploy Worker step."
          echo "Run this workflow again with that URL in the worker_url input to register the Telegram webhook."
          echo "Then message the bot with /whoami, add the ID as BROLL_ALLOWED_TELEGRAM_USER_IDS, and run this workflow again."
