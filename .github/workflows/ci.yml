name: Editor tests

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --upgrade pytest boto3 requests
      - name: Validate workflow YAML
        run: ruby -e 'require "yaml"; YAML.parse_file(".github/workflows/edit-clip.yml"); YAML.parse_file(".github/workflows/deploy-broll-uploader.yml"); YAML.parse_file(".github/workflows/ci.yml")'
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Validate B-roll Worker bundle
        run: wrangler deploy --dry-run --config workers/broll-uploader/wrangler.toml
      - name: Run Python unit tests
        run: python -m pytest
      - name: Run Telegram uploader tests
        run: node --test workers/broll-uploader/test/*.test.mjs
